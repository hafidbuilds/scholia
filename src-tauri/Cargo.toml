[package]
name = "scholia-desktop"
version = "0.1.0"
description = "Desktop EPUB study companion"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scholia-core = { path = ".." }
serde = { version = "1", features = ["derive"] }
